name: CI

# PR을 `main`에 합치기 전에 포맷 검사, 빌드, 테스트를 자동으로 실행한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소 내용을 읽는 권한만 사용한다.
permissions:
  contents: read

jobs:
  deploy-assets:
    name: Deployment assets (offline mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: for script in deploy/scripts/*.sh deploy/tests/*.sh; do bash -n "$script"; done
      - name: Test release operations without AWS or systemd
        run: sudo bash deploy/tests/release-test.sh

  build:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 빌드가 외부 의존성 코드를 실행하므로 저장소 토큰을 .git/config에 남기지 않는다.
      # 이 워크플로는 저장소에 push하지 않아 저장된 토큰이 필요 없다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성과 빌드 캐시를 실행 사이에 재사용한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck --console=plain

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 네트워크 응답 순서를 제어해 계정·방 전환과 완료 화면의 회귀를 검사한다.
      - name: Test frontend request lifecycle
        run: node --test --test-timeout=10000 src/test/js/*.test.mjs

      # spotlessCheck는 위에서 이미 실행했으므로 제외한다. `build`에는 테스트가 포함된다.
      - name: Build and test
        run: ./gradlew build -x spotlessCheck --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  ownership-postgres:
    name: Internal ownership PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 이 컨테이너와 자격 증명은 CI 한 번에만 사용하는 시험용이다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sale_ai_test_internal_ci
          POSTGRES_USER: aibe7
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aibe7 -d sale_ai_test_internal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test ownership completion and admin reads on PostgreSQL
        env:
          SALE_DRAFT_TEST_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test_internal_ci
          SALE_DRAFT_TEST_DB_USER: aibe7
          SALE_DRAFT_TEST_DB_PASSWORD: local-ci-test-only
        run: ./gradlew test --tests org.example.springtestci.ownership.InternalTradeOwnershipHttpPostgresTest --tests org.example.springtestci.admin.AdminHttpTest --rerun-tasks --console=plain
      - name: Upload PostgreSQL test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ownership-postgres-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  p5-postgres:
    name: P5 direct transfer and migration PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sale_ai_test
          POSTGRES_USER: aibe7
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aibe7 -d sale_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run P5 PostgreSQL and migration gates
        env:
          OWN_INT_TEST_ENABLED: "true"
          OWN_INT_TEST_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test
          OWN_INT_TEST_DB_USER: aibe7
          OWN_INT_TEST_DB_PASSWORD: local-ci-test-only
          OWN_INT_TEST_REDIS_HOST: localhost
          OWN_INT_TEST_REDIS_PORT: "6379"
          SALE_DRAFT_TEST_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test
          SALE_DRAFT_TEST_DB_USER: aibe7
          SALE_DRAFT_TEST_DB_PASSWORD: local-ci-test-only
          DEPLOY_DDL_TEST_ENABLED: "true"
          DEPLOY_DDL_TEST_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test
          DEPLOY_DDL_TEST_DB_USER: aibe7
          DEPLOY_DDL_TEST_DB_PASSWORD: local-ci-test-only
        run: >-
          ./gradlew test
          --tests '*DirectTransferPostgresTest'
          --tests '*InternalTradeOwnershipHttpPostgresTest'
          --tests '*H40MigrationCompatibilityTest'
          --tests '*DeployMigrationPostgresTest'
          --tests '*NormalizeOwnershipVersionPostgresTest'
          --tests '*ListingDraftOwnershipHttpTest'
          --tests '*LegacyProductMigrationChecksumTest*'
          --tests '*DbConvergencePostgresTest'
          --rerun-tasks
          --console=plain
      - name: Verify legacy PostgreSQL test execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          method = 'fullChainWithLegacyOriginalsValidatesStrictlyOnlyWhenOriginalsAreLoaded'
          cases = [
              case
              for report in Path('build/test-results/test').glob('TEST-*.xml')
              for case in ET.parse(report).getroot().iter('testcase')
              if case.get('name') == method + '()'
              and case.get('classname', '').endswith('LegacyProductMigrationChecksumTest$OnPostgres')
          ]
          if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Legacy PostgreSQL test must execute exactly once and pass without skipping')
          print(f'{method}: tests=1 failures=0 errors=0 skipped=0 (JUnit XML)')
          PY
      - name: Verify convergence PostgreSQL test execution
        run: python3 scripts/db/verify-convergence-tests.py
      - name: Resolve full candidate migration manifest
        env:
          CONVERGENCE_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test
          CONVERGENCE_DB_USER: aibe7
          CONVERGENCE_DB_PASSWORD: local-ci-test-only
          CONVERGENCE_DATABASE: sale_ai_test
          CONVERGENCE_SCHEMA: public
          CONVERGENCE_TARGET_ID: disposable-ci-postgresql
        run: |
          export CONVERGENCE_URL_SHA256=$(printf '%s' "$CONVERGENCE_DB_URL" | sha256sum | cut -d' ' -f1)
          ./gradlew dbConvergence -PdbLineage=legacy -PdbAction=manifest --console=plain > build/convergence-manifest.txt
      - name: Preserve primary convergence evidence
        run: |
          mkdir -p build/convergence-primary-junit
          cp build/test-results/test/TEST-*.xml build/convergence-primary-junit/
      - name: Run HTTP regressions on normalized legacy schema
        env:
          CONVERGENCE_API_LINEAGE: legacy
          SALE_DRAFT_TEST_DB_URL: jdbc:postgresql://localhost:5432/sale_ai_test
          SALE_DRAFT_TEST_DB_USER: aibe7
          SALE_DRAFT_TEST_DB_PASSWORD: local-ci-test-only
        run: |
          ./gradlew test --tests '*InternalTradeOwnershipHttpPostgresTest' --rerun-tasks --console=plain
          python3 scripts/db/verify-convergence-tests.py --api-only
      - name: Upload P5 PostgreSQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-postgres-test-report
          path: |
            build/reports/tests/test
            build/test-results/test/TEST-*.xml
            build/convergence-manifest.txt
            build/convergence-primary-junit/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7
