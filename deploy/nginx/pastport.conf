log_format pastport_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $pastport_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name REPLACE_WITH_APPROVED_HOST;
    access_log /var/log/nginx/pastport_access.log pastport_safe;
    error_log /var/log/nginx/pastport_error.log crit;
    return 308 https://REPLACE_WITH_APPROVED_HOST$uri$is_args$args;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_APPROVED_HOST;
    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_APPROVED_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_APPROVED_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/pastport_access.log pastport_safe;
    error_log /var/log/nginx/pastport_error.log crit;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pastport_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_cache off;
    }
}
