<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이메일 인증 · PastPort</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261031-brand">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/brand.css?v=20261031">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Pretendard,system-ui,sans-serif;background:#f6f7f8;color:#1b1d24}
    main{max-width:360px;margin:16px;padding:32px 24px;border-radius:12px;background:#fff;text-align:center;box-shadow:0 2px 8px rgba(22,23,29,.08)}
    h1{margin:0 0 8px;font-size:20px}p{margin:0;color:#62646a;line-height:1.6}h1.ok{color:#0d7c7a}h1.fail{color:#b70f28}
  </style>
</head>
<body>
  <main>
    <img class="pastport-logo pastport-logo--verification" src="/images/brand/pastport-logo-v1.png" alt="PastPort" width="2172" height="724">
    <h1 id="title"></h1>
    <p id="desc"></p>
  </main>
  <script>
    const ok = new URLSearchParams(location.search).get('result') === 'ok';
    document.getElementById('title').textContent = ok ? '이메일 인증이 완료됐어요' : '인증 링크를 확인해 주세요';
    document.getElementById('title').className = ok ? 'ok' : 'fail';
    document.getElementById('desc').textContent = ok
      ? '이제 로그인할 수 있어요. 이 창을 닫고 로그인 화면에서 로그인해 주세요.'
      : '링크가 만료되었거나 이미 사용되었어요. 로그인 화면에서 인증 메일을 다시 받아 주세요.';
  </script>
</body>
</html>
