<div class="au split">
  <aside class="au-side" aria-label="가입 후 이용 순서">
    <div class="lg-brand"><img class="pastport-logo" src="/images/brand/pastport-logo-v1.png" alt="PastPort" width="2172" height="724"></div>
    <h2>가입하면 이렇게 쓸 수 있어요</h2>
    <p>제품 등록부터 다음 주인에게 넘기는 것까지 이어져요.</p>
    <ol class="au-steps">
      <li><b>1</b><div><strong>제품 등록</strong><span>구매 정보와 시리얼 번호를 한 번만 입력해요.</span></div></li>
      <li><b>2</b><div><strong>문서 보관</strong><span>영수증과 수리 내역은 개인정보를 가린 사본으로 보관해요.</span></div></li>
      <li><b>3</b><div><strong>거래 · 소유권 이전</strong><span>판매할 때 기록이 다음 주인에게 그대로 넘어가요.</span></div></li>
    </ol>
    <div data-auth-art></div>
    <p class="lg-note">개인정보는 가린 사본으로만 보관해요.</p>
  </aside>

  <section class="au-form">
    <p class="lg-eyebrow">JOIN</p>
    <h1 class="au-h">회원가입</h1>
    <p class="lg-sub">가입하고 내 노트북의 기록을 쌓기 시작하세요.</p>
    <form data-auth-form="signup" novalidate>
      <p class="au-msg" role="alert" hidden></p>
      <label class="sc-field"><span>이메일<em>*</em></span><input name="email" type="email" placeholder="name@example.com" autocomplete="username" maxlength="254" required><small>가입 후 이 주소로 인증 메일을 보내요. 30분 안에 인증하지 않으면 가입이 취소돼요.</small></label>
      <label class="sc-field"><span>비밀번호<em>*</em></span><input name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password" maxlength="64" required></label>
      <div class="au-rules"><span data-rule="length">8자 이상</span><span data-rule="letter">영문 포함</span><span data-rule="digit">숫자 포함</span><span data-rule="special">특수문자 포함</span></div>
      <label class="sc-field"><span>비밀번호 확인<em>*</em></span><input name="passwordConfirm" type="password" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password" maxlength="64" required><small data-match></small></label>
      <label class="sc-field"><span>닉네임<em>*</em></span><input name="nickname" placeholder="2~12자" maxlength="12" required><small>거래 상대에게는 닉네임만 보여요.</small></label>
      <div class="au-agree">
        <label class="all"><input type="checkbox" data-agree-all> 전체 동의</label>
        <label><input type="checkbox" data-agree-required> 이용약관 동의 <em>(필수)</em></label>
        <label><input type="checkbox" data-agree-required> 개인정보 수집·이용 동의 <em>(필수)</em></label>
      </div>
      <button type="submit" class="sc-btn primary block">가입하기</button>
      <div class="au-sub">이미 계정이 있나요?<button type="button" data-page="auth">로그인</button></div>
    </form>
  </section>
</div>
