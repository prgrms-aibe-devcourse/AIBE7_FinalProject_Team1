<div class="sc-head">
  <div><span class="eyebrow">Pastport 마켓</span><h1>내 거래 · 채팅</h1><p>문의 대화부터 예약, 거래까지 한곳에서 안전하게 진행해요.</p></div>
</div>

<div class="dl">
  <section class="dl-list" aria-label="대화 목록">
    <div class="dl-tabs">
      <b data-deals-scope>전체 채팅</b>
      <button type="button" class="sc-btn sm" data-page="deals" data-deals-all hidden>전체 채팅</button>
    </div>
    <div class="dl-rows" data-deals-rooms>
      <p class="sub" style="padding:20px;text-align:center;color:var(--muted)">대화방을 불러오는 중이에요…</p>
    </div>
  </section>

  <section class="dl-chat" aria-label="대화" data-deals-chat-section style="display:none">
    <button type="button" class="sc-btn sm dl-back" data-deals-back>대화 목록</button>
    <div class="dl-top" data-deals-chat-top>
      <span class="laptop"></span>
      <div data-deals-room-title><b>대화방</b><span>상대방과의 대화</span></div>
      <span class="sc-badge ok" data-deals-listing-status>판매 중</span>
      <button type="button" class="sc-btn sm" data-deals-leave aria-label="대화방 나가기">나가기</button>
      <button type="button" class="dl-request-btn" data-deals-request-buy style="margin-left:8px" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>예약 요청</span>
      </button>
    </div>
    <div class="dl-flow" aria-label="거래 진행 단계">
      <span class="now" data-flow-step="inquiry">문의</span>
      <span data-flow-step="pending">구매 요청</span>
      <span data-flow-step="reserved">예약 완료</span>
      <span data-flow-step="completed">거래 완료</span>
    </div>
    <section class="dl-completion" data-deals-completion aria-label="거래 완료 확인" hidden></section>
    <section class="dl-completion" data-deals-cancel-history aria-label="취소 내역" hidden></section>
    <div class="dl-msgs" data-deals-messages>
      <!-- 메시지 목록이 동적으로 들어옵니다 -->
    </div>
    <div class="dl-comp">
      <input data-deals-input placeholder="메시지를 입력하세요" aria-label="메시지 입력">
      <button type="button" class="sc-btn primary" data-deals-send>보내기</button>
    </div>
  </section>

  <aside class="dl-info" data-deals-info style="display:none">
    <section>
      <h3>거래 정보</h3>
      <div class="dl-kv"><span>판매글</span><b data-deals-info-title>–</b></div>
      <div class="dl-kv"><span>판매 가격</span><b data-deals-info-price>–</b></div>
      <div class="dl-kv"><span>예약 상태</span><b data-deals-info-trade-status>문의 진행 중</b></div>
      <div class="sc-note info" style="margin-top:12px"><i>i</i><span>구매 요청을 판매자가 수락하면 다른 구매자의 추가 예약이 차단되고 안전하게 예약 상태가 됩니다.</span></div>
    </section>
  </aside>
</div>

<style>
.dl-completion{padding:16px 20px;background:var(--paper,#fff);border-bottom:1px solid var(--line);font-size:14px;max-height:55vh;overflow:auto}
.dl-completion[hidden]{display:none}
.dl-completion h3{font-size:16px;margin:0 0 8px}
.dl-completion p{margin:8px 0;line-height:1.5;overflow-wrap:anywhere}
.dl-completion details{margin:12px 0}
.dl-completion summary{cursor:pointer;font-weight:600}
.dl-completion ul{padding-left:20px;margin:8px 0;line-height:1.6}
.dl-completion-ack{display:flex;align-items:flex-start;gap:8px;margin:12px 0;line-height:1.5}
.dl-completion-ack input{width:16px;height:16px;margin:3px 0 0;flex:none}
.dl-completion-actions{display:flex;flex-wrap:wrap;gap:8px}
.dl-completion-change{padding:8px 0;border-bottom:1px solid var(--line)}
.dl-completion-error{color:#9c2929}
.dl-completion select{display:block;width:100%;margin:8px 0;padding:8px;font:inherit;border:1px solid var(--line);background:white;color:inherit}
.dl-completion button:disabled{opacity:1;color:#60666c;background:#eef0f2;cursor:default}
.dl-back{display:none}
.dl-request-btn[hidden]{display:none}
@media(max-width:860px){
  #deals .dl-has-room .dl-list{display:none}
  #deals .dl:not(.dl-has-room) .dl-chat{display:none!important}
  #deals .dl-info{border-left:0;border-top:1px solid var(--line)}
  .dl-back{display:block;align-self:flex-start;margin:12px 16px}
  .dl-completion{padding:14px 16px;max-height:60vh}
}
.dl-request-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 15px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: var(--ink, #242a2e);
  border: none;
  border-radius: 9999px;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: -0.2px;
}
.dl-request-btn:hover {
  background: #181d22;
}
.dl-request-btn svg {
  flex-shrink: 0;
}
</style>
