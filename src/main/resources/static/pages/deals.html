<div class="sc-head">
  <div><span class="eyebrow">기록상회 마켓</span><h1>내 거래 · 채팅</h1><p>문의 대화부터 예약, 거래까지 한곳에서 안전하게 진행해요.</p></div>
</div>

<div class="dl">
  <section class="dl-list" aria-label="대화 목록">
    <div class="dl-tabs">
      <button class="chip-btn active" data-deals-tab="ALL">전체</button>
      <button class="chip-btn" data-deals-tab="BUY">구매 문의</button>
      <button class="chip-btn" data-deals-tab="SELL">판매 문의</button>
    </div>
    <div class="dl-rows" data-deals-rooms>
      <p class="sub" style="padding:20px;text-align:center;color:var(--muted)">대화방을 불러오는 중이에요…</p>
    </div>
  </section>

  <section class="dl-chat" aria-label="대화" data-deals-chat-section style="display:none">
    <div class="dl-top" data-deals-chat-top>
      <span class="laptop"></span>
      <div data-deals-room-title><b>대화방</b><span>상대방과의 대화</span></div>
      <span class="sc-badge ok" data-deals-listing-status>판매 중</span>
      <button type="button" class="dl-request-btn" data-deals-request-buy style="margin-left:auto" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>예약 요청</span>
      </button>
    </div>
    <div class="dl-flow" aria-label="거래 진행 단계">
      <span class="now" data-flow-step="inquiry">문의</span>
      <span data-flow-step="pending">구매 요청</span>
      <span data-flow-step="reserved">예약 완료</span>
    </div>
    <div class="dl-msgs" data-deals-messages>
      <!-- 메시지 목록이 동적으로 들어옵니다 -->
    </div>
    <div class="dl-comp">
      <input data-deals-input placeholder="메시지를 입력하세요" aria-label="메시지 입력">
      <button type="button" class="sc-btn primary" data-deals-send>보내기</button>
    </div>
  </section>

  <aside class="dl-info" data-deals-info style="display:none">
    <section>
      <h3>거래 정보</h3>
      <div class="dl-kv"><span>판매글</span><b data-deals-info-title>–</b></div>
      <div class="dl-kv"><span>판매 가격</span><b data-deals-info-price>–</b></div>
      <div class="dl-kv"><span>예약 상태</span><b data-deals-info-trade-status>문의 진행 중</b></div>
      <div style="margin-top:16px;display:grid;gap:8px" data-deals-transfer-area hidden>
        <button type="button" class="sc-btn primary block" data-deals-btn-transfer>소유권 이전 링크/QR 발급</button>
        <p class="sub" style="margin:0;font-size:12px;color:var(--muted)">구매자에게 제품을 건넬 때 링크나 QR을 보여주세요.</p>
      </div>
      <div class="sc-note info" style="margin-top:12px"><i>i</i><span>구매 요청을 판매자가 수락하면 다른 구매자의 추가 예약이 차단되고 안전하게 예약 상태가 됩니다.</span></div>
    </section>
  </aside>
</div>

  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 15px;
  font-size: 13px;

  color: #fff;
  background: var(--blue, #2563eb);
  border: none;

  cursor: pointer;

  box-shadow: 0 3px 8px rgba(37, 99, 235, 0.35);
  transform: translateY(-1px);
}

  flex-shrink: 0;
