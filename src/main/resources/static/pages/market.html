<div class="mk-head">
  <div><h1>중고 노트북 <small data-market-total>목록 조회 중</small></h1>
    <p>판매 중인 제품을 제조사·가격·사양 조건으로 찾아보세요.</p></div>
  <button type="button" class="button primary" data-page="sell">판매하기</button>
</div>
<div class="mk-cats" role="group" aria-label="제조사 빠른 선택">
  <button type="button" class="chip-btn active" data-market-manufacturer="" aria-pressed="true">전체</button>
  <button type="button" class="chip-btn" data-market-manufacturer="Apple" aria-pressed="false">Apple</button>
  <button type="button" class="chip-btn" data-market-manufacturer="Samsung" aria-pressed="false">Samsung</button>
  <button type="button" class="chip-btn" data-market-manufacturer="LG" aria-pressed="false">LG</button>
  <button type="button" class="chip-btn" data-market-manufacturer="Lenovo" aria-pressed="false">Lenovo</button>
</div>
<div class="mk-layout">
  <form class="mk-filter" data-market-form aria-label="판매글 필터" novalidate>
    <p class="sub mk-filter-help">조건은 함께 적용돼요. 등록된 사양이 없는 제품은 해당 사양 조건에서 제외돼요.</p>
    <section><h3>제조사</h3>
      <label class="mk-field"><span>제조사명</span><input name="manufacturer" maxlength="100" list="market-manufacturers" placeholder="전체 제조사"></label>
      <datalist id="market-manufacturers"><option value="Apple"></option><option value="Samsung"></option><option value="삼성"></option><option value="LG"></option><option value="Lenovo"></option></datalist>
    </section>
    <section><h3>판매 가격</h3><div class="mk-range">
      <input name="minPrice" inputmode="numeric" placeholder="최소 가격" aria-label="최소 가격" maxlength="15"><span>~</span>
      <input name="maxPrice" inputmode="numeric" placeholder="최대 가격" aria-label="최대 가격" maxlength="15">
    </div></section>
    <details class="mk-spec-fields"><summary>제품 사양으로 찾기</summary><div class="mk-spec-grid">
      <label class="mk-field"><span>CPU 포함 문구</span><input name="cpu" maxlength="100" placeholder="예: M3, Core Ultra"></label>
      <label class="mk-field"><span>GPU 포함 문구</span><input name="gpu" maxlength="100" placeholder="예: RTX"></label>
      <label class="mk-field"><span>최소 메모리 (GB)</span><input name="minRamGb" type="number" min="1" step="1" placeholder="제한 없음"></label>
      <label class="mk-field"><span>최소 저장 용량 (GB)</span><input name="minStorageGb" type="number" min="1" step="1" placeholder="제한 없음"></label>
      <label class="mk-field"><span>저장장치 종류</span><select name="storageType"><option value="">전체</option><option value="SSD">SSD</option><option value="HDD">HDD</option><option value="MIXED">혼합</option></select></label>
      <label class="mk-field"><span>운영체제 포함 문구</span><input name="os" maxlength="50" placeholder="예: Windows, macOS"></label>
    </div></details>
    <section><h3>상태 등급</h3>
      <label class="mk-field"><span>최소 등급</span><select name="minConditionGrade"><option value="">전체</option><option value="5">5등급</option><option value="4">4등급 이상</option><option value="3">3등급 이상</option><option value="2">2등급 이상</option><option value="1">1등급 이상</option></select></label>
    </section>
    <button type="submit" class="sc-btn primary mk-apply">필터 적용</button>
    <button type="button" class="mk-reset" data-market-reset>필터 초기화</button>
  </form>
  <div class="mk-main">
    <div class="mk-bar">
      <label class="mk-control">정렬 <select data-market-sort aria-label="판매글 정렬"><option value="LATEST">최신순</option><option value="PRICE_ASC">낮은 가격순</option><option value="PRICE_DESC">높은 가격순</option></select></label>
      <label class="mk-control">페이지당 <select data-market-size aria-label="페이지당 판매글 수"><option value="10">10개</option><option value="20" selected>20개</option><option value="40">40개</option><option value="100">100개</option></select></label>
      <span class="sc-badge">판매 중인 글만 표시</span>
    </div>
    <p class="sub" data-market-message role="status" aria-live="polite">판매글을 불러오는 중이에요.</p>
    <button type="button" class="sc-btn" data-market-retry hidden>다시 불러오기</button>
    <div class="mk-grid" data-market-items aria-busy="true"></div>
    <nav class="mk-pagination" data-market-pagination aria-label="판매글 페이지" hidden>
      <button type="button" class="sc-btn" data-market-prev disabled>이전</button>
      <span data-market-page></span>
      <button type="button" class="sc-btn" data-market-next disabled>다음</button>
    </nav>
  </div>
</div>
