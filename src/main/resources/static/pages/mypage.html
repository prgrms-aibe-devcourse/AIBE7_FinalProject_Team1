<div class="mp-guest sc-card" data-mp="guest" hidden>
  <h2>로그인이 필요해요</h2>
  <p>로그인하면 내 계정 정보를 볼 수 있어요.</p>
  <button type="button" class="sc-btn primary" data-page="auth">로그인하기</button>
</div>

<div class="mp-layout" data-mp="member" hidden>
  <div class="mp-main">
    <section class="mp-summary" aria-label="내 계정">
      <div class="mp-profile">
        <span class="mp-avatar">
          <img data-mp-img alt="내 프로필 사진" hidden>
          <span data-mp-field="initial" aria-hidden="true"></span>
        </span>
        <div class="mp-who">
          <strong><span data-mp-field="nickname"></span>님</strong>
          <span data-mp-field="email"></span>
          <div class="mp-photo-actions">
            <button type="button" class="mp-photo-btn" data-mp-open aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 변경</button>
          </div>
        </div>
      </div>
      <dl class="mp-stats">
        <div><dt>보유 제품</dt><dd data-mp-field="ownedCount">-</dd></div>
        <div><dt>내 판매글</dt><dd data-mp-stat="listings">-</dd></div>
        <div><dt>문서</dt><dd data-mp-stat="documents">-</dd></div>
      </dl>
    </section>

    <section class="mp-block" aria-labelledby="mp-doc-h">
      <div class="mp-block-head"><h2 id="mp-doc-h">문서 보관함</h2></div>
      <table class="mp-table">
        <thead><tr><th>제품</th><th>종류</th><th>상태</th></tr></thead>
        <tbody data-mp-list="documents"><tr><td colspan="3" class="mp-empty-row">불러오는 중이에요…</td></tr></tbody>
      </table>
    </section>

    <section class="mp-block" aria-labelledby="mp-listing-h">
      <div class="mp-block-head"><h2 id="mp-listing-h">내 판매글</h2></div>
      <table class="mp-table">
        <thead><tr><th>판매글</th><th>상태</th><th>가격</th></tr></thead>
        <tbody data-mp-list="listings"><tr><td colspan="3" class="mp-empty-row">불러오는 중이에요…</td></tr></tbody>
      </table>
    </section>

    <section class="mp-block" aria-labelledby="mp-product-h">
      <div class="mp-block-head"><h2 id="mp-product-h">내 제품</h2></div>
      <table class="mp-table">
        <thead><tr><th>제품</th><th>제조사</th><th>구매일</th></tr></thead>
        <tbody data-mp-list="products"><tr><td colspan="3" class="mp-empty-row">불러오는 중이에요…</td></tr></tbody>
      </table>
    </section>
  </div>
</div>

<dialog class="mp-dialog" data-mp-dialog aria-labelledby="mp-dialog-title">
  <h2 id="mp-dialog-title">프로필 사진</h2>
  <div class="mp-dialog-body">
    <span class="mp-avatar mp-avatar-lg">
      <img data-mp-pimg alt="프로필 사진 미리보기" hidden>
      <span data-mp-pinitial aria-hidden="true"></span>
    </span>
    <strong data-mp-pname></strong>
    <small>사진은 원형으로 잘려 이렇게 보여요. 내 계정에 저장돼요.</small>
  </div>
  <div class="mp-dialog-tools">
    <label class="mp-photo-btn">사진 선택<input type="file" accept="image/png,image/jpeg,image/webp" data-mp-pfile hidden></label>
    <button type="button" class="mp-photo-btn" data-mp-premove>기본 이미지로</button>
  </div>
  <small class="mp-photo-msg" data-mp-pmsg role="status" hidden></small>
  <div class="mp-dialog-actions">
    <button type="button" class="sc-btn" data-mp-cancel>취소</button>
    <button type="button" class="sc-btn primary" data-mp-save>저장</button>
  </div>
</dialog>
