<div class="au split">
  <aside class="au-side" aria-label="제품 여권 소개">
    <div class="lg-brand"><img class="pastport-logo" src="/images/brand/pastport-logo-v1.png" alt="PastPort" width="2172" height="724"></div>
    <h2>내 노트북의 모든 기록을<br>한 장의 여권으로</h2>
    <p>구매부터 수리, 소유권 이전까지 이어서 기록해요.</p>
    <div data-auth-art></div>
  </aside>

  <section class="au-form">
    <p class="lg-eyebrow">WELCOME BACK</p>
    <h1 class="au-h">로그인</h1>
    <p class="lg-sub">이메일로 로그인하고 내 제품 여권을 이어서 확인하세요.</p>
    <form data-auth-form="login" novalidate>
      <p class="au-msg" role="alert" hidden></p>
      <button type="button" class="sc-btn" data-email-resend hidden>인증 메일 다시 받기</button>
      <label class="sc-field"><span>이메일</span><input name="email" type="email" placeholder="name@example.com" autocomplete="username" maxlength="254" required></label>
      <label class="sc-field"><span>비밀번호</span><input name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" maxlength="64" required></label>
      <button type="submit" class="sc-btn primary block">로그인</button>
      <div class="au-links"><span>이메일 찾기</span><span>비밀번호 찾기</span></div>
    </form>
    <div class="lg-join">아직 계정이 없나요?<button type="button" data-page="signup">회원가입</button></div>
  </section>
</div>
