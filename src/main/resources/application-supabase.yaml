spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${SUPABASE_DB_MAX_POOL_SIZE:5}
      minimum-idle: ${SUPABASE_DB_MIN_IDLE:1}
      connection-timeout: ${SUPABASE_DB_CONNECTION_TIMEOUT_MS:30000}
      data-source-properties:
        sslmode: require
        tcpKeepAlive: true
  flyway:
    enabled: true
    # db/deploy: 정식 경로에 없는 거래·이력 DDL을 멱등하게 보완한다(상세는 docs/FLYWAY_DEPLOY_REPAIR.md).
    locations: classpath:db/migration,classpath:db/deploy
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: INFO
    org.example.springtestci: INFO
