spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aibe7;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  product:
    serial-secret: ${PRODUCT_SERIAL_SECRET:change-this-local-product-serial-secret-32-bytes}
  features:
    chat-api:
      enabled: ${CHAT_API_ENABLED:true}
    trade-purchase-requests:
      enabled: ${TRADE_PURCHASE_REQUESTS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:change-this-local-jwt-secret-at-least-32-bytes}
    refresh-cookie-secure: false

logging:
  level:
    root: INFO
    org.example.springtestci: DEBUG
