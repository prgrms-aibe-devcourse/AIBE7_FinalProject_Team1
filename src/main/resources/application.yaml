spring:
  application:
    name: aibe7-final-project-team1
  config:
    import: optional:file:${DOTENV_PATH:.env}[.properties]
  profiles:
    default: local
  flyway:
    enabled: true
    ignore-migration-patterns: "*:*"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Swagger의 쓰기 요청도 일반 화면과 같은 CSRF 쿠키·헤더를 사용한다.
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  ai:
    summary:
      enabled: ${AI_SUMMARY_ENABLED:true}
    listing:
      enabled: ${AI_LISTING_ENABLED:true}
      api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
      model: ${AI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
      user-requests-per-minute: ${AI_USER_REQUESTS_PER_MINUTE:3}
      global-requests-per-minute: ${AI_GLOBAL_REQUESTS_PER_MINUTE:30}
    stale-minutes: 5
    gemini:
      # 키가 비어 있으면 AI 추출 API는 503(DOC_010)으로 응답한다. 키는 환경 변수로만 주입한다.
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: 30
  supabase:
    url: ${SUPABASE_URL:}
    secret: ${SUPABASE_SECRET:}
  features:
    listing-history:
      enabled: ${LISTING_HISTORY_ENABLED:false}
    trade-purchase-requests:
      enabled: ${TRADE_PURCHASE_REQUESTS_ENABLED:false}
    trade-p3:
      enabled: ${TRADE_P3_ENABLED:false}
    trade-p4:
      enabled: ${TRADE_P4_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${LOCAL_STORAGE_ROOT:./storage}
    signing-secret: ${STORAGE_SIGNING_SECRET:${app.jwt.secret}}
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:ap-northeast-2}
      prefix: ${STORAGE_S3_PREFIX:pastport}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
