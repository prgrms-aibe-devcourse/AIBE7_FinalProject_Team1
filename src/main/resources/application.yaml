spring:
  application:
    name: aibe7-final-project-team1
  config:
    import: optional:file:${DOTENV_PATH:.env}[.properties]
  profiles:
    default: local
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  ai:
    summary:
      enabled: ${AI_SUMMARY_ENABLED:true}
    listing:
      enabled: ${AI_LISTING_ENABLED:true}
      api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
      model: ${AI_MODEL:gemini-3.5-flash-lite}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
      user-requests-per-minute: ${AI_USER_REQUESTS_PER_MINUTE:3}
      global-requests-per-minute: ${AI_GLOBAL_REQUESTS_PER_MINUTE:30}
  supabase:
    url: ${SUPABASE_URL:}
    secret: ${SUPABASE_SECRET:}
  features:
    trade-purchase-requests:
      enabled: false
    trade-p3:
      enabled: false
    trade-p4:
      enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:./storage}
    signing-secret: ${STORAGE_SIGNING_SECRET:${app.jwt.secret}}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
